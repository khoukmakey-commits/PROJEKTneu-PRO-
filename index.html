<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goethe B2">
<meta name="theme-color" content="#16204A">
<title>Goethe B2 · Mein Lehrer Pro</title>
<style>
:root{
  --bg:#F3F6FC;--card:#fff;--ink:#16204A;--mut:#5B6478;--line:#D8DFEE;--hero:#16204A;
  --L:#2563EB;--H:#7C3AED;--S:#059669;--P:#EA580C;--acc:#3B82F6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1230;--card:#18214A;--ink:#E8ECFF;--mut:#9AA6D0;--line:#2B376B;--hero:#222E66;--acc:#60A5FA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1230;--card:#18214A;--ink:#E8ECFF;--mut:#9AA6D0;--line:#2B376B;--hero:#222E66;--acc:#60A5FA;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.w{max-width:760px;margin:0 auto;padding:14px 14px 70px}
.hero{background:linear-gradient(135deg,var(--hero),#3B4FB8);color:#fff;border-radius:22px;padding:20px;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(22,32,74,.22)}
.hero h1{margin:0 0 4px;font-size:22px}.hero p{margin:0;opacity:.9;font-size:13px}
.pill{display:inline-block;background:rgba(255,255,255,.18);border-radius:99px;padding:4px 12px;font-size:12px;margin:12px 6px 0 0}
.bar{height:8px;background:rgba(255,255,255,.25);border-radius:9px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#34D399,#FBBF24);width:0;transition:width .5s}
.tabs{display:flex;gap:5px;margin:14px 0;background:var(--card);padding:5px;border-radius:16px;border:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:10px 4px;border-radius:12px;font:600 13px inherit;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.tag{display:inline-block;color:#fff;border-radius:8px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.03em}
h2{font-size:17px;margin:8px 0}.mut{color:var(--mut);font-size:13px}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.task:last-of-type{border:0}
.task b{flex:0 0 24px;height:24px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:14px;color:#fff;margin-top:1px}
.task.d b{background:#10B981;border-color:#10B981}
.task.d span{text-decoration:line-through;opacity:.55}
.btn{border:0;border-radius:12px;padding:12px 16px;font:700 14px inherit;color:#fff;background:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.98)}
.btn.g{background:#10B981}
.btn.p{background:#3B82F6}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.day{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.day i{width:10px;height:10px;border-radius:50%;flex:0 0 10px;background:var(--line)}
.day.d i{background:#10B981}.day.t{font-weight:700}
.day em{margin-left:auto;font-style:normal;color:var(--mut);font-size:12px}
select,textarea,input[type="text"]{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;font:14px inherit;margin:4px 0 10px}
textarea{min-height:84px;resize:vertical}
label{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;display:block;margin-top:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;gap:6px;margin:6px 0 12px}
.seg button{flex:1;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 12.5px inherit;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
#out{line-height:1.7;font-size:14.5px}
#out b{color:var(--acc)}
.hide{display:none !important}
.qbox{border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:10px 0;background:var(--bg)}
.qbox.ok{border-left:5px solid #10B981}
.qbox.err{border-left:5px solid #EF4444}
.score-banner{padding:16px;border-radius:16px;margin-bottom:14px;color:#fff;font-weight:700;line-height:1.5}
.score-banner.pass{background:linear-gradient(135deg,#059669,#10B981)}
.score-banner.fail{background:linear-gradient(135deg,#DC2626,#EF4444)}
.qrow{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;margin:6px 0;background:var(--bg);border:1px solid var(--line);border-radius:12px;gap:8px;flex-wrap:wrap}
.qrow b{min-width:36px;font-size:14px}
.opt-group{display:flex;gap:5px;flex-wrap:wrap}
.opt-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;min-width:34px;height:34px;font:700 13.5px inherit;cursor:pointer;padding:0 6px}
.opt-btn.sel{background:var(--L);color:#fff;border-color:var(--L)}
.badge-part{display:inline-block;background:var(--line);color:var(--ink);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700;margin:10px 0 4px}
.rm-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
.rm-table th,.rm-table td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.rm-table th{background:var(--bg);font-weight:700}
</style>
</head>
<body>
<div class="w">
  <div class="hero">
    <h1>🎓 Goethe B2 · Mein Lehrer Pro</h1>
    <p>Projekt B2 neu · Korrektur, Schlüsselwörter, Synonyme, Schreiben & Sprechen</p>
    <span class="pill" id="cd">⏳ Noch Tage</span>
    <span class="pill" id="pg">✅ 0 / 0 Tage</span>
    <div class="bar"><i id="pb"></i></div>
  </div>

  <div class="tabs">
    <button data-t="h" class="on">📅 Heute</button>
    <button data-t="l">👨‍🏫 Lehrer</button>
    <button data-t="r">✍️ Redemittel</button>
    <button data-t="p">📋 Plan</button>
  </div>

  <section id="v-h"></section>

  <section id="v-l" class="hide">
    <div class="card">
      <div class="g2">
        <div><label>Modelltest (1–15)</label><select id="mt"></select></div>
        <div><label>Modul</label><select id="md"></select></div>
      </div>
      <label id="tl-lbl">Teil</label>
      <select id="tl"></select>

      <div class="seg">
        <button data-m="c" class="on">✅ Korrektur & Tchr7</button>
        <button data-m="k">🔑 Schlüsselwörter</button>
        <button data-m="t">📋 Ganzer Test (1–30)</button>
      </div>

      <div id="answ">
        <label>Antwortbogen (klicke direkt auf deine Antwort)</label>
        <div id="quick-grid"></div>
        <label id="an-lbl">Meine Antworten / Mein Text</label>
        <textarea id="an" placeholder="1-c 2-b 3-a ... (Hören Teil 1: 1R 2a 3F ...)"></textarea>
      </div>

      <div class="row">
        <button class="btn p" id="go">👨‍🏫 Frag den Lehrer (S7e7 & Chr7)</button>
        <button class="btn o" id="show-sol">👁️ Wrrini Lösung</button>
        <button class="btn o" id="clr-ans">🗑️ Mss7</button>
      </div>
    </div>

    <div class="card hide" id="oc">
      <div id="out"></div>
    </div>
  </section>

  <section id="v-r" class="hide">
    <div class="card">
      <div class="seg" id="rm-tabs">
        <button data-rm="s1" class="on">📝 Schreiben T1</button>
        <button data-rm="s2">✉️ Schreiben T2</button>
        <button data-rm="p1">🎤 Sprechen T1</button>
        <button data-rm="p2">💬 Sprechen T2</button>
      </div>
      <div id="rm-content"></div>
    </div>
  </section>

  <section id="v-p" class="hide">
    <div class="card" id="all"></div>
  </section>
</div>

<script>
(function(){
  var memStore = {};
  var storage = {
    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return memStore[k] || null; } },
    set: function(k, v){ try { localStorage.setItem(k, v); } catch(e){ memStore[k] = v; } }
  };

  var M = {
    L: ['Lesen', 'var(--L)'],
    H: ['Hören', 'var(--H)'],
    S: ['Schreiben', 'var(--S)'],
    P: ['Sprechen', 'var(--P)']
  };

  var iso = function(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  };

  var D0 = new Date(2026, 10, 4), D1 = new Date(2027, 0, 25), EX = new Date(2027, 0, 29);
  var WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];

  var intro = [
    ['L','Einführung · Format + Methode Lesen',['Prüfungsformat lesen','Methode Lesen lernen','Modelltest 1 Lesen Teil 1+2 probieren'],75],
    ['H','Einführung · Methode Hören',['Methode Hören lernen','Modelltest 1 Hören Teil 1+2','Notizen mit Schlüsselwörtern prüfen'],75],
    ['S','Einführung · Methode Schreiben',['Redemittel abschreiben','Struktur Teil 1+2 lernen','Gliederung für Modelltest 1 schreiben'],75],
    ['P','Einführung · Methode Sprechen',['Redemittel lernen','Teil 1: 2 Min Vortrag aufnehmen','Teil 2: 2 Argumente üben'],75]
  ];

  function cyc(t, i){
    var T = 'Modelltest ' + t;
    return [
      ['L', T + ' · Lesen', ['Fragen markieren: Schlüsselwörter (15 Min)', 'Teile 1–5 mit Zeitlimit (65 Min)', 'Beleg-Satz unterstreichen', 'Im Lehrer korrigieren lassen', '10 neue Wörter'], 100],
      ['H', T + ' · Hören', ['Schlüsselwörter markieren (10 Min)', 'Teile 1–4 hören', 'Notizen im Lehrer prüfen lassen', '10 neue Wörter'], 80],
      ['S', T + ' · Schreiben', ['Leitpunkte → Schlüsselwörter + Gliederung', 'Teil 1 schreiben (35 Min)', 'Teil 2 schreiben (20 Min)', 'Texte im Lehrer korrigieren lassen'], 80],
      ['P', T + ' · Sprechen', ['15 Min Vorbereitung', 'Teil 1 + Teil 2 aufnehmen', 'Transkript im Lehrer prüfen', '3 Fehler notieren'], 70],
      ['L', T + ' · Wiederholung', ['Fehler-Tagebuch ausfüllen', 'Schwächsten Teil nochmal', '20 Wörter wiederholen'], 60]
    ][i];
  }

  var plan = [], ci = 0;
  for(var d = new Date(D0), k = 0; d <= D1; d.setDate(d.getDate()+1), k++){
    var id = iso(d), r;
    if(k < 4) r = intro[k];
    else if(id === '2026-11-23') r = ['P','Termin-Tag (leicht)',['10 Wörter wiederholen','Redemittel Sprechen 1× laut lesen'],20];
    else if(id === '2027-01-23') r = ['L','Probeprüfung 1 · Lesen + Hören',['Ein Modelltest unter Prüfungsbedingungen','Im Lehrer korrigieren lassen'],130];
    else if(id === '2027-01-24') r = ['S','Probeprüfung 2 · Schreiben + Sprechen',['Schreiben 75 Min','Sprechen aufnehmen','Im Lehrer prüfen lassen'],120];
    else if(id === '2027-01-25') r = ['P','Letzte Wiederholung',['Fehler-Tagebuch lesen','Redemittel durchgehen','Früh schlafen'],45];
    else {
      var mtNum = Math.floor(ci/5) + 1;
      r = cyc(mtNum, ci%5);
      r = [r[0], r[1], r[2], r[3], mtNum];
      ci++;
    }
    plan.push({ id:id, w:WD[d.getDay()], dm:d.getDate()+'.'+(d.getMonth()+1)+'.', m:r[0], t:r[1], k:r[2], min:r[3], mt:r[4]||1 });
  }

  var S = { done:{}, sel:null, savedAns:{} };
  try {
    var rawSaved = storage.get('g2_pro_v3');
    if(rawSaved) S = Object.assign(S, JSON.parse(rawSaved));
  } catch(e){}

  function save(){
    try { storage.set('g2_pro_v3', JSON.stringify({ done:S.done, savedAns:S.savedAns })); } catch(e){}
  }

  var dn = function(p){
    var checked = S.done[p.id] || [];
    return p.k.every(function(_, i){ return checked[i]; });
  };

  function todayIdx(){
    var nowStr = iso(new Date());
    var idx = plan.findIndex(function(p){ return p.id >= nowStr; });
    return (idx < 0) ? plan.length - 1 : idx;
  }
  if(S.sel === null) S.sel = todayIdx();

  function head(){
    var n = Math.ceil((EX - new Date()) / 864e5);
    document.getElementById('cd').textContent = (n > 0) ? ('⏳ noch ' + n + ' Tage (29.01.2027)') : '🎯 Prüfungstag';
    var c = plan.filter(dn).length;
    document.getElementById('pg').textContent = '✅ ' + c + ' / ' + plan.length + ' Tage';
    document.getElementById('pb').style.width = (100 * c / plan.length) + '%';
  }

  function today(){
    var p = plan[S.sel];
    if(!p) return;
    var ch = S.done[p.id] || [], col = M[p.m][1];
    var h = '<div class="card" style="border-top:4px solid ' + col + '">' +
            '<span class="tag" style="background:' + col + '">' + M[p.m][0] + '</span> ' +
            '<span class="mut">' + p.w + ' ' + p.dm + ' · ca. ' + p.min + ' Min</span>' +
            '<h2>' + p.t + '</h2>';
    p.k.forEach(function(x, i){
      var isDone = ch[i];
      h += '<div class="task' + (isDone ? ' d' : '') + '" data-i="' + i + '">' +
           '<b>' + (isDone ? '✓' : '') + '</b><span>' + x + '</span></div>';
    });
    h += '<div class="row">' +
         '<button class="btn g" id="all1">Alles erledigt ✓</button>' +
         '<button class="btn" id="tol">→ Zum Lehrer</button>';
    if(S.sel > 0) h += '<button class="btn o" id="pv">←</button>';
    if(S.sel < plan.length - 1) h += '<button class="btn o" id="nx">→</button>';
    h += '</div></div>';
    document.getElementById('v-h').innerHTML = h;
  }

  function list(){
    var cur = todayIdx();
    document.getElementById('all').innerHTML = plan.map(function(p, i){
      return '<div class="day' + (dn(p) ? ' d' : '') + (i === cur ? ' t' : '') + '" data-d="' + i + '">' +
             '<i></i>' + p.w + ' ' + p.dm + ' <span style="color:' + M[p.m][1] + '">● </span>' + p.t +
             '<em>' + p.min + '′</em></div>';
    }).join('');
  }

  function render(){ head(); today(); list(); }

  document.getElementById('v-h').onclick = function(e){
    var p = plan[S.sel];
    if(!p) return;
    var t = e.target.closest('.task'), b = e.target.closest('button');
    if(t){
      var arr = S.done[p.id] = S.done[p.id] || [];
      arr[+t.dataset.i] = !arr[+t.dataset.i];
      save(); render();
    } else if(b){
      if(b.id === 'all1'){ S.done[p.id] = p.k.map(function(){ return true; }); save(); }
      else if(b.id === 'pv') S.sel--;
      else if(b.id === 'nx') S.sel++;
      else if(b.id === 'tol'){ pre(p); tab('l'); return; }
      render();
    }
  };

  document.getElementById('all').onclick = function(e){
    var d = e.target.closest('.day');
    if(d){ S.sel = +d.dataset.d; render(); tab('h'); }
  };

  function tab(tName){
    document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.t === tName); });
    ['h','l','r','p'].forEach(function(x){
      var sec = document.getElementById('v-' + x);
      if(sec) sec.classList.toggle('hide', x !== tName);
    });
    window.scrollTo(0,0);
  }

  document.querySelector('.tabs').onclick = function(e){
    var b = e.target.closest('button');
    if(b && b.dataset.t) tab(b.dataset.t);
  };

  var MP_TO_EP = {
    30:100, 29:97, 28:93, 27:90, 26:87, 25:83, 24:80, 23:77, 22:73, 21:70,
    20:67, 19:63, 18:60, 17:57, 16:53, 15:50, 14:47, 13:43, 12:40, 11:37,
    10:33, 9:30, 8:27, 7:23, 6:20, 5:17, 4:13, 3:10, 2:7, 1:3, 0:0
  };

  var SOLUTIONS = {
    1: {
      L: {1:'a',2:'c',3:'d',4:'b',5:'d',6:'a',7:'b',8:'b',9:'c', 10:'e',11:'a',12:'d',13:'g',14:'h',15:'b', 16:'b',17:'b',18:'c',19:'a',20:'b',21:'a', 22:'d',23:'f',24:'g',25:'b',26:'h',27:'e', 28:'e',29:'h',30:'a'},
      H: {1:'r',2:'a',3:'f',4:'b',5:'r',6:'c',7:'f',8:'c',9:'f',10:'c', 11:'b',12:'a',13:'c',14:'a',15:'b',16:'b', 17:'c',18:'a',19:'b',20:'c',21:'c',22:'c', 23:'c',24:'a',25:'b',26:'b',27:'a',28:'c',29:'b',30:'a'}
    },
    2: {
      L: {1:'b',2:'c',3:'d',4:'b',5:'a',6:'d',7:'b',8:'d',9:'c', 10:'c',11:'g',12:'h',13:'b',14:'f',15:'e', 16:'b',17:'a',18:'b',19:'c',20:'c',21:'a', 22:'f',23:'b',24:'d',25:'h',26:'e',27:'g', 28:'f',29:'e',30:'a'},
      H: {1:'f',2:'a',3:'r',4:'b',5:'r',6:'c',7:'f',8:'a',9:'f',10:'c', 11:'a',12:'c',13:'b',14:'a',15:'a',16:'b', 17:'a',18:'b',19:'c',20:'c',21:'b',22:'a', 23:'a',24:'a',25:'b',26:'c',27:'c',28:'b',29:'c',30:'a'}
    },
    3: {
      L: {1:'c',2:'d',3:'c',4:'d',5:'a',6:'b',7:'a',8:'c',9:'b', 10:'e',11:'g',12:'c',13:'b',14:'d',15:'h', 16:'b',17:'c',18:'b',19:'c',20:'a',21:'b', 22:'c',23:'g',24:'e',25:'b',26:'d',27:'h', 28:'e',29:'f',30:'c'},
      H: {1:'f',2:'b',3:'r',4:'b',5:'f',6:'a',7:'f',8:'c',9:'r',10:'c', 11:'b',12:'a',13:'b',14:'a',15:'c',16:'a', 17:'c',18:'c',19:'b',20:'a',21:'b',22:'c', 23:'b',24:'a',25:'b',26:'c',27:'c',28:'a',29:'b',30:'c'}
    },
    4: {
      L: {1:'b',2:'d',3:'d',4:'b',5:'c',6:'b',7:'a',8:'c',9:'c', 10:'h',11:'e',12:'g',13:'a',14:'b',15:'d', 16:'b',17:'a',18:'c',19:'b',20:'b',21:'a', 22:'d',23:'h',24:'b',25:'g',26:'f',27:'c', 28:'h',29:'e',30:'b'},
      H: {1:'f',2:'c',3:'r',4:'b',5:'r',6:'c',7:'r',8:'b',9:'f',10:'c', 11:'a',12:'a',13:'c',14:'a',15:'a',16:'b', 17:'c',18:'b',19:'c',20:'b',21:'a',22:'b', 23:'b',24:'a',25:'a',26:'c',27:'c',28:'b',29:'b',30:'c'}
    },
    5: {
      L: {1:'d',2:'c',3:'c',4:'b',5:'d',6:'c',7:'a',8:'c',9:'b', 10:'c',11:'g',12:'a',13:'b',14:'h',15:'e', 16:'a',17:'b',18:'c',19:'b',20:'b',21:'c', 22:'f',23:'g',24:'c',25:'b',26:'h',27:'e', 28:'b',29:'e',30:'g'},
      H: {1:'f',2:'a',3:'r',4:'c',5:'f',6:'b',7:'r',8:'a',9:'f',10:'c', 11:'a',12:'c',13:'b',14:'a',15:'b',16:'c', 17:'c',18:'b',19:'a',20:'a',21:'c',22:'b', 23:'c',24:'b',25:'a',26:'a',27:'c',28:'c',29:'b',30:'a'}
    },
    6: {
      L: {1:'c',2:'b',3:'a',4:'c',5:'d',6:'a',7:'c',8:'d',9:'b', 10:'f',11:'b',12:'a',13:'h',14:'e',15:'d', 16:'b',17:'a',18:'b',19:'c',20:'b',21:'a', 22:'b',23:'h',24:'f',25:'e',26:'d',27:'g', 28:'g',29:'d',30:'b'},
      H: {1:'f',2:'b',3:'f',4:'a',5:'r',6:'a',7:'r',8:'b',9:'f',10:'c', 11:'b',12:'a',13:'c',14:'c',15:'b',16:'c', 17:'c',18:'a',19:'b',20:'a',21:'b',22:'c', 23:'b',24:'a',25:'a',26:'a',27:'c',28:'c',29:'b',30:'c'}

  function getAutoDetail(mt, md, q, sol){
    var letterDisp = (md === 'H' && q <= 10 && q % 2 === 1) ? (sol === 'r' ? 'Richtig' : 'Falsch') : sol.toUpperCase();
    return {
      kw: "Modelltest " + mt + " · " + md + " · Frage " + q + " (" + letterDisp + ")",
      syn: "Entspricht dem Belegsatz und der Argumentation im Buch.",
      exp: "الجواب صحيح ومطابق للنص ديال كتاب Projekt B2 neu ودليل المعلم."
    };
  }

  function getDetailData(mt, md, q, sol){
    var baseKey = mt + '_' + md;
    if(DETAILS[baseKey] && DETAILS[baseKey][q]){
      return DETAILS[baseKey][q];
    }
    if(DETAILS[baseKey] && DETAILS[baseKey][String(q)]){
      return DETAILS[baseKey][String(q)];
    }
    return getAutoDetail(mt, md, q, sol);
  }

  var TL = {

    S: ['Teil 1 · Forumsbeitrag (≥150 Wörter)', 'Teil 2 · Formelle Nachricht (≥100 Wörter)'],
    P: ['Teil 1 · Vortrag (≈4 Min)', 'Teil 2 · Diskussion (≈5 Min)']

  var RANGES = {
    L: [[1,9], [10,15], [16,21], [22,27], [28,30]],

  };

  var elMt = document.getElementById('mt');

  var mode = 'c';

  elMt.innerHTML = Array.from({length:15}, function(_, i){
    return '<option value="' + (i+1) + '">Modelltest ' + (i+1) + '</option>';
  }).join('');

  elMd.innerHTML = Object.keys(M).map(function(k){
    return '<option value="' + k + '">' + M[k][0] + '</option>';
  }).join('');

  function getRange(){
    var m = elMd.value, t = +elTl.value;
    if(m !== 'L' && m !== 'H') return [1, 2];
    if(mode === 't') return [1, 30];
    var list = RANGES[m] || RANGES.L;
    return list[t] || list[0] || [1, 9];
  }

  function getOptionsForQuestion(m, q){
    if(m === 'L'){
      if(q <= 9) return ['a','b','c','d'];
      if(q <= 15) return ['a','b','c','d','e','f','g','h'];
      if(q <= 21) return ['a','b','c'];
      if(q <= 27) return ['b','c','d','e','f','g','h'];
      return ['a','b','c','d','e','f','g','h'];
    } else {
      if(q <= 10 && q % 2 === 1) return ['R','F'];
      return ['a','b','c'];
    }
  }

  function currentKey(){ return elMt.value + '_' + elMd.value; }

  function renderGrid(){
    var m = elMd.value;
    if(m !== 'L' && m !== 'H'){ elQuick.innerHTML = ''; return; }
    var rng = getRange(), s = rng[0], e = rng[1];
    var saved = S.savedAns[currentKey()] || {};
    var h = '';
    for(var q = s; q <= e; q++){
      var opts = getOptionsForQuestion(m, q);
      var curVal = (saved[q] || '').toLowerCase();
      h += '<div class="qrow"><b>#' + q + '</b><div class="opt-group">';
      opts.forEach(function(o){
        var isSel = (curVal === o.toLowerCase());
        h += '<button type="button" class="opt-btn' + (isSel ? ' sel' : '') + '" data-q="' + q + '" data-v="' + o.toLowerCase() + '">' + o + '</button>';
      });
      h += '</div></div>';
    }
    elQuick.innerHTML = h;
    syncSavedToTextarea();

    elQuick.querySelectorAll('.opt-btn').forEach(function(btn){
      btn.onclick = function(){
        var qNum = +btn.dataset.q, val = btn.dataset.v, k = currentKey();
        S.savedAns[k] = S.savedAns[k] || {};
        if(S.savedAns[k][qNum] === val) delete S.savedAns[k][qNum];
        else S.savedAns[k][qNum] = val;
        save();
        renderGrid();
      };
    });
  }

  function syncSavedToTextarea(){
    var m = elMd.value;
    if(m !== 'L' && m !== 'H') return;
    var rng = getRange(), s = rng[0], e = rng[1];
    var saved = S.savedAns[currentKey()] || {};
    var parts = [];
    for(var q = s; q <= e; q++){
      if(saved[q]){
        var disp = (m === 'H' && q <= 10 && q % 2 === 1) ? saved[q].toUpperCase() : saved[q];
        parts.push(q + '-' + disp);
      }
    }
    elAn.value = parts.join(' ');
  }

  function parseUserAnswers(raw, startQ, endQ){
    var res = {};
    if(!raw) return res;
    var regex = /(\d{1,2})\s*[:=\-\.]?\s*([a-hA-HrRfF]|richtig|falsch)/g;
    var match, foundExplicit = false;
    while((match = regex.exec(raw)) !== null){
      foundExplicit = true;
      var qNum = parseInt(match[1], 10);
      var val = match[2].toLowerCase();
      if(val === 'richtig') val = 'r';
      if(val === 'falsch') val = 'f';
      res[qNum] = val;
    }
    if(!foundExplicit){
      var tokens = raw.trim().split(/[\s,;]+/).filter(Boolean);
      tokens.forEach(function(tk, idx){
        var qNum = startQ + idx;
        if(qNum <= endQ){
          var v = tk.toLowerCase();
          if(v === 'richtig') v = 'r';
          if(v === 'falsch') v = 'f';
          if(/^[a-hrf]$/.test(v)) res[qNum] = v;
        }
      });
    }
    return res;
  }

  elAn.oninput = function(){
    var m = elMd.value;
    if(m !== 'L' && m !== 'H') return;
    var rng = getRange();
    var parsed = parseUserAnswers(elAn.value, rng[0], rng[1]);
    var key = currentKey();
    S.savedAns[key] = Object.assign(S.savedAns[key] || {}, parsed);
    save();
  };

  function fillTl(){
    var m = elMd.value;
    elTl.innerHTML = TL[m].map(function(x, i){ return '<option value="' + i + '">' + x + '</option>'; }).join('');
    chk();
  }

  function chk(){
    var m = elMd.value, sp = (m === 'S' || m === 'P');
    var isWhole = (mode === 't' && !sp);
    elTl.classList.toggle('hide', isWhole);
    elTlLbl.classList.toggle('hide', isWhole);
    elAnsw.classList.toggle('hide', mode === 'k' && !sp);
    renderGrid();
  }

  function pre(p){ elMt.value = p.mt; elMd.value = p.m; fillTl(); }

  elMd.onchange = function(){ elOc.classList.add('hide'); fillTl(); };
  elTl.onchange = function(){ elOc.classList.add('hide'); renderGrid(); };
  elMt.onchange = function(){ elOc.classList.add('hide'); renderGrid(); };

  document.querySelector('.seg').onclick = function(e){
    var b = e.target.closest('button');
    if(!b || !b.dataset.m) return;
    mode = b.dataset.m;
    document.querySelectorAll('.seg button').forEach(function(x){ x.classList.toggle('on', x === b); });
    chk();
  };

  function runEvaluation(onlySolutions){
    var mt = +elMt.value, md = elMd.value;
    elOc.classList.remove('hide');

    var rng = getRange(), startQ = rng[0], endQ = rng[1];
    var official = (SOLUTIONS[mt] && SOLUTIONS[mt][md]) || {};
    var userMap = onlySolutions ? {} : parseUserAnswers(elAn.value, startQ, endQ);

    if(mode === 'k' && !onlySolutions){
      var kwHtml = '<h2>🔑 Schlüsselwörter & Belege · Modelltest ' + mt + ' (' + M[md][0] + ')</h2>';
      for(var kq = startQ; kq <= endQ; kq++){
        var ksol = official[kq] || '';
        var kd = getDetailData(mt, md, kq, ksol);
        var ksolDisp = (md === 'H' && kq <= 10 && kq % 2 === 1) ? (ksol === 'r' ? 'Richtig (R)' : 'Falsch (F)') : ksol.toUpperCase();
        kwHtml += '<div class="qbox">' +
          '<div><b>Frage ' + kq + '</b> (Lösung: <b>' + ksolDisp + '</b>)</div>' +
          '<div style="margin-top:6px;font-size:13.5px">🔑 <b>Schlüsselwort:</b> ' + kd.kw + '<br>🔄 <b>Synonym / Beleg:</b> <i>„' + kd.syn + '“</i><br>💡 <b>Tchr7:</b> ' + kd.exp + '</div>' +
          '</div>';
      }
      elOut.innerHTML = kwHtml;
      elOc.scrollIntoView({ behavior:'smooth', block:'start' });
      return;
    }

    var correctCount = 0, totalCount = endQ - startQ + 1;
    var html = '', itemsHtml = '';

    for(var q = startQ; q <= endQ; q++){
      var sol = official[q] || '';
      var usr = userMap[q];
      var isOk = (usr && usr.toLowerCase() === sol.toLowerCase());
      if(isOk) correctCount++;

      var solDisp = (md === 'H' && q <= 10 && q % 2 === 1) ? (sol === 'r' ? 'Richtig (R)' : 'Falsch (F)') : sol.toUpperCase();
      var usrDisp = usr ? ((md === 'H' && q <= 10 && q % 2 === 1) ? (usr === 'r' ? 'Richtig (R)' : 'Falsch (F)') : usr.toUpperCase()) : '—';

      var d = getDetailData(mt, md, q, sol);
      var statusClass = onlySolutions ? '' : (isOk ? 'ok' : 'err');
      var badge = onlySolutions
        ? ('🔑 <b>Lösung: ' + solDisp + '</b>')
        : (isOk
            ? ('✅ <b>S7i7! (' + usrDisp + ')</b>')
            : ('❌ <b>Ghlet:</b> Drti <b>' + usrDisp + '</b> → Ts7i7 S7i7 hwa: <b>' + solDisp + '</b>'));

      itemsHtml += '<div class="qbox ' + statusClass + '">' +
        '<div><b>Frage ' + q + ':</b> ' + badge + '</div>' +
        '<div style="margin-top:6px;font-size:13.5px">' +
        '🔑 <b>Schlüsselwort:</b> ' + d.kw + '<br>' +
        '🔄 <b>Synonym / Beleg:</b> <i>„' + d.syn + '“</i><br>' +
        '💡 <b>Tchr7:</b> ' + d.exp + '</div>' +
        '</div>';
    }

    if(!onlySolutions){
      var epInfo = '';
      if(totalCount === 30){
        var ep = MP_TO_EP[correctCount] != null ? MP_TO_EP[correctCount] : Math.round(correctCount * 100 / 30);
        var passed = (ep >= 60);
        epInfo = '<div class="score-banner ' + (passed ? 'pass' : 'fail') + '">' +
                 '🎯 Modelltest ' + mt + ' (' + M[md][0] + '): ' + correctCount + ' / 30 Messpunkte = ' + ep + ' / 100 Ergebnispunkte' +
                 '<br>' + (passed ? '🎉 Mabrouk! BESTANDEN (≥ 60 Punkte)' : '⚠️ Noch nicht bestanden (< 60 Punkte — khassek 18/30 Messpunkte)') +
                 '</div>';
      } else {
        var pct = Math.round((correctCount / totalCount) * 100);
        epInfo = '<div class="score-banner ' + (pct >= 60 ? 'pass' : 'fail') + '">' +
                 '🎯 Modelltest ' + mt + ' (' + M[md][0] + '): ' + correctCount + ' / ' + totalCount + ' S7a7 (' + pct + '%)' +
                 '</div>';
      }
      html += epInfo;
    } else {
      html += '<h2>👁️ Offizielle Lösungen · Modelltest ' + mt + ' (' + M[md][0] + ')</h2>';
    }

    html += itemsHtml;
    elOut.innerHTML = html;
    elOc.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  document.getElementById('go').onclick = function(){ runEvaluation(false); };
  document.getElementById('show-sol').onclick = function(){ runEvaluation(true); };
  document.getElementById('clr-ans').onclick = function(){
    var key = currentKey(), rng = getRange();
    if(S.savedAns[key]){
      for(var q = rng[0]; q <= rng[1]; q++) delete S.savedAns[key][q];
      save();
    }
    elAn.value = '';
    renderGrid();
    elOc.classList.add('hide');
  };

  fillTl();
  render();
})();
</script>
</body>
</html>
